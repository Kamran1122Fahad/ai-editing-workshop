<!doctype html>
<!--
  Reel compositor. reel/engine.js builds the stage and the seek(t) API; edit.js is this project's edit.
  tmp/meta.js is written by scripts/prep.sh (duration and frame count of source/edit.mp4).
  Open directly in a browser to preview: click to play with audio/mix.wav, ?t=12.3 freezes a frame, ?captions=0 hides captions.
-->
<html>
<head>
<meta charset="utf-8" />
<title>reel</title>
<link rel="stylesheet" href="reel/engine.css" />
<style>
  @font-face { font-family: 'Pixelify Sans'; src: url(assets/fonts/pixelify.woff2) format('woff2'); font-weight: 400 700; font-display: block; }
  @font-face { font-family: 'Jersey 10'; src: url(assets/fonts/jersey10.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: 'Silkscreen'; src: url(assets/fonts/silkscreen.woff2) format('woff2'); font-weight: 400; font-display: block; }
  :root { --c-bg: #F6F1E7; --c-bg2: #FFFDF8; --c-grid: rgba(21,21,26,0.045); --c-muted: #6B6B76; }
  @font-face { font-family: 'Poppins'; src: url(assets/fonts/poppins700.woff2) format('woff2'); font-weight: 700; font-display: block; }
  /* captions: second caption reference - white rounded box, bold Poppins, karaoke: spoken words black, upcoming light grey */
  .cap { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 44px; line-height: 80px; letter-spacing: -0.4px; color: #C9C9C9; text-shadow: none; }
  .cap span { background: #fff; padding: 9px 24px 12px; border-radius: 17px; box-shadow: 0 12px 34px -14px rgba(0,0,0,0.4); }
  .cap i { font-style: normal; color: inherit !important; }
  .cap b { font-weight: 700; color: #C9C9C9; }
  .cap b.on { color: #111114; }
</style>
</head>
<body>
<script src="tmp/meta.js"></script>
<script src="reel/engine.js"></script>
<script src="edit.js"></script>
</body>
</html>
